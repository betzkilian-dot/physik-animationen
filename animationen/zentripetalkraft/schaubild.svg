<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Körper auf einer Kreisbahn mit Geschwindigkeit v, Radius r und Zentripetalkraft zur Mitte; daneben ein a-ω²-Diagramm mit Ursprungsgerade">
<style>
  svg{--bg:#f6f7f9;--ink:#16191d;--muted:#5d6670;--axis:#8f98a3;--grid:#e3e6ea;--track:#b9c0c8;
      --v:#2563eb;--f:#c81e1e;--body:#d9590b;--body-ink:#ffffff;--pt:#1f4fd1;--disk:#e9edf3}
  @media (prefers-color-scheme: dark){
    svg{--bg:#22262c;--ink:#e7eaee;--muted:#9aa3ad;--axis:#66707b;--grid:#2e333a;--track:#58616b;
        --v:#5b8cff;--f:#f05a5a;--body:#ff8a3d;--body-ink:#1b1e23;--pt:#7ea2ff;--disk:#2a2f36}
  }
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--ink)}
  .lbl{font-size:20px;font-style:italic;font-weight:600}
  .ax{font-size:19px;fill:var(--muted)}
</style>
<defs>
  <marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--v)"/></marker>
  <marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--f)"/></marker>
  <marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--muted)"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--axis)"/></marker>
</defs>
<rect width="640" height="360" style="fill:var(--bg)"/>

<!-- Drehteller und Kreisbahn -->
<circle cx="175" cy="185" r="150" style="fill:var(--disk)"/>
<circle cx="175" cy="185" r="125" fill="none" style="stroke:var(--track)" stroke-width="2.5" stroke-dasharray="7 6"/>
<line x1="175" y1="185" x2="300" y2="185" style="stroke:var(--muted)" stroke-width="2" stroke-dasharray="4 4"/>
<!-- Radius als Maßlinie -->
<g style="stroke:var(--muted)" stroke-width="2">
  <line x1="175" y1="228" x2="300" y2="228"/>
  <line x1="175" y1="220" x2="175" y2="236"/><line x1="300" y1="220" x2="300" y2="236"/>
</g>
<text class="lbl" x="232" y="256">r</text>
<!-- Drehsinn ω -->
<path d="M170.1 157.4A28 28 0 0 0 147.4 189.9" fill="none" style="stroke:var(--muted)" stroke-width="2.5" marker-end="url(#am)"/>
<text class="lbl" x="124" y="160">ω</text>
<circle cx="175" cy="185" r="5" style="fill:var(--ink)"/>
<text class="ax" x="166" y="210">M</text>
<!-- Zentripetalkraft -->
<line x1="287" y1="185" x2="226" y2="185" style="stroke:var(--f)" stroke-width="5" stroke-linecap="round" marker-end="url(#af)"/>
<text class="lbl" x="246" y="173" style="fill:var(--f)">F<tspan font-size="14" dy="5">Z</tspan></text>
<!-- Geschwindigkeit -->
<line x1="300" y1="165" x2="300" y2="82" style="stroke:var(--v)" stroke-width="5" stroke-linecap="round" marker-end="url(#av)"/>
<text class="lbl" x="320" y="108" style="fill:var(--v)">v</text>
<!-- Körper (Smartphone auf dem Drehteller) -->
<rect x="289" y="167" width="22" height="36" rx="5" style="fill:var(--body)"/>
<rect x="293" y="172" width="14" height="24" rx="2" style="fill:var(--body-ink)" opacity=".35"/>
<text class="lbl" x="318" y="200">m</text>

<!-- Mini-Diagramm a über ω² -->
<g style="stroke:var(--grid)" stroke-width="1.5">
  <line x1="410" y1="240" x2="600" y2="240"/><line x1="410" y1="190" x2="600" y2="190"/>
  <line x1="410" y1="140" x2="600" y2="140"/><line x1="410" y1="90" x2="600" y2="90"/>
</g>
<line x1="410" y1="290" x2="612" y2="290" style="stroke:var(--axis)" stroke-width="2" marker-end="url(#aa)"/>
<line x1="410" y1="290" x2="410" y2="62" style="stroke:var(--axis)" stroke-width="2" marker-end="url(#aa)"/>
<line x1="410" y1="290" x2="597" y2="88" style="stroke:var(--pt)" stroke-width="3" stroke-linecap="round"/>
<g style="stroke:var(--f)" stroke-width="2.5" stroke-linecap="round">
  <line x1="440" y1="254.6" x2="440" y2="266.6"/>
  <line x1="478" y1="205.5" x2="478" y2="219.5"/>
  <line x1="516" y1="169.4" x2="516" y2="185.4"/>
  <line x1="554" y1="122.3" x2="554" y2="140.3"/>
  <line x1="590" y1="89.4" x2="590" y2="109.4"/>
</g>
<g style="fill:var(--f)">
  <circle cx="440" cy="260.6" r="5"/><circle cx="478" cy="212.5" r="5"/><circle cx="516" cy="177.4" r="5"/>
  <circle cx="554" cy="131.3" r="5"/><circle cx="590" cy="99.4" r="5"/>
</g>
<text class="ax" x="424" y="66"><tspan font-style="italic">a</tspan> in m/s²</text>
<text class="ax" x="612" y="314" text-anchor="end"><tspan font-style="italic">ω</tspan>² in s⁻²</text>

<!-- Formel -->
<text x="410" y="344" font-size="21" font-weight="600"><tspan font-style="italic">F</tspan><tspan font-size="14" dy="5">Z</tspan><tspan dy="-5"> = </tspan><tspan font-style="italic">m</tspan> · <tspan font-style="italic">ω</tspan>² · <tspan font-style="italic">r</tspan></text>
</svg>
