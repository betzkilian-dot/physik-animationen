<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Ein Pkw überholt einen Lkw mit Sicherheitsabstand, Gegenverkehr kommt entgegen; darunter Zeit-Ort- und Zeit-Geschwindigkeit-Diagramm mit Beginn und Ende des Überholvorgangs">
<style>
  svg{--bg:#f6f7f9;--ink:#16191d;--muted:#5d6670;--axis:#8f98a3;--grid:#e3e6ea;
      --a:#2563eb;--b:#d9590b;--c:#7c3aed;--start:#15803d;--end:#c81e1e;
      --road:#575b61;--lane:#f8f8f8;--grass:#a6c793;--glass:#ffffff}
  @media (prefers-color-scheme: dark){
    svg{--bg:#22262c;--ink:#e7eaee;--muted:#9aa3ad;--axis:#66707b;--grid:#2e333a;
        --a:#5b8cff;--b:#ff8a3d;--c:#a78bfa;--start:#34c46b;--end:#f05a5a;
        --road:#3b3f45;--lane:#d9d9d9;--grass:#3d5634;--glass:#1b1e23}
  }
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--ink)}
  .car{font-size:17px;font-weight:700;fill:#ffffff}
  .ax{font-size:19px;fill:var(--muted)}
  .sm{font-size:18px;font-weight:600}
  .zone{font-size:15px;font-weight:600;fill:#ffffff}
</style>
<defs>
  <marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--a)"/></marker>
  <marker id="mc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--c)"/></marker>
  <marker id="mx" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--axis)"/></marker>
</defs>
<rect width="640" height="360" style="fill:var(--bg)"/>

<!-- Straße -->
<rect x="0" y="14" width="640" height="10" style="fill:var(--grass)"/>
<rect x="0" y="24" width="640" height="112" style="fill:var(--road)"/>
<rect x="0" y="136" width="640" height="10" style="fill:var(--grass)"/>
<line x1="0" y1="29" x2="640" y2="29" style="stroke:var(--lane)" stroke-width="2"/>
<line x1="0" y1="131" x2="640" y2="131" style="stroke:var(--lane)" stroke-width="2"/>
<line x1="0" y1="80" x2="640" y2="80" style="stroke:var(--lane)" stroke-width="3" stroke-dasharray="26 22"/>

<!-- Sicherheitsabstand vor B -->
<rect x="405" y="89" width="155" height="34" rx="3" style="fill:var(--b);stroke:var(--b)" fill-opacity=".28" stroke-width="2" stroke-dasharray="6 4"/>
<text class="zone" x="482.5" y="110" text-anchor="middle">Sicherheitsabstand</text>

<!-- Lkw B -->
<rect x="250" y="89" width="122" height="34" rx="3" style="fill:var(--b)" opacity=".75"/>
<rect x="375" y="91" width="26" height="30" rx="4" style="fill:var(--b)"/>
<rect x="392" y="94" width="6" height="24" rx="2" style="fill:var(--glass)" opacity=".5"/>
<text class="car" x="311" y="111" text-anchor="middle">B</text>

<!-- Pkw A überholt -->
<rect x="318" y="41" width="58" height="28" rx="7" style="fill:var(--a)"/>
<rect x="354" y="45" width="10" height="20" rx="3" style="fill:var(--glass)" opacity=".5"/>
<text class="car" x="340" y="61" text-anchor="middle">A</text>
<line x1="384" y1="55" x2="456" y2="55" style="stroke:var(--a)" stroke-width="4" stroke-linecap="round" marker-end="url(#ma)"/>
<!-- Gegenverkehr C -->
<rect x="566" y="41" width="58" height="28" rx="7" style="fill:var(--c)"/>
<rect x="576" y="45" width="10" height="20" rx="3" style="fill:var(--glass)" opacity=".5"/>
<text class="car" x="602" y="61" text-anchor="middle">C</text>
<line x1="558" y1="55" x2="506" y2="55" style="stroke:var(--c)" stroke-width="4" stroke-linecap="round" marker-end="url(#mc)"/>

<!-- Zeit-Ort-Diagramm -->
<g style="stroke:var(--grid)" stroke-width="1.5">
  <line x1="60" y1="295" x2="320" y2="295"/><line x1="60" y1="255" x2="320" y2="255"/><line x1="60" y1="215" x2="320" y2="215"/>
</g>
<line x1="100" y1="172" x2="100" y2="335" style="stroke:var(--start)" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="316" y1="172" x2="316" y2="335" style="stroke:var(--end)" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="60" y1="335" x2="334" y2="335" style="stroke:var(--axis)" stroke-width="2" marker-end="url(#mx)"/>
<line x1="60" y1="335" x2="60" y2="160" style="stroke:var(--axis)" stroke-width="2" marker-end="url(#mx)"/>
<line x1="60" y1="184" x2="320" y2="207" style="stroke:var(--c)" stroke-width="2.5" stroke-dasharray="7 5"/>
<line x1="60" y1="312.1" x2="320" y2="235.6" style="stroke:var(--b)" stroke-width="3.5" stroke-linecap="round"/>
<path d="M60 335.0 L70 332.0 L80 329.1 L90 326.2 L100 323.0 L110 319.7 L120 316.1 L130 312.4 L140 308.5 L150 304.3 L160 300.0 L170 295.5 L180 290.7 L190 285.7 L200 280.6 L210 275.2 L220 269.6 L230 264.0 L240 258.5 L250 252.9 L260 247.3 L270 241.7 L280 236.1 L290 230.5 L300 224.9 L310 219.3 L320 213.8" fill="none" style="stroke:var(--a)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="ax" x="70" y="168"><tspan font-style="italic">x</tspan> in m</text>
<text class="ax" x="334" y="357" text-anchor="end"><tspan font-style="italic">t</tspan> in s</text>

<!-- Zeit-Geschwindigkeit-Diagramm -->
<g style="stroke:var(--grid)" stroke-width="1.5">
  <line x1="380" y1="295" x2="600" y2="295"/><line x1="380" y1="255" x2="600" y2="255"/><line x1="380" y1="215" x2="600" y2="215"/>
</g>
<line x1="413.8" y1="172" x2="413.8" y2="335" style="stroke:var(--start)" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="596.7" y1="172" x2="596.7" y2="335" style="stroke:var(--end)" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="380" y1="335" x2="614" y2="335" style="stroke:var(--axis)" stroke-width="2" marker-end="url(#mx)"/>
<line x1="380" y1="335" x2="380" y2="160" style="stroke:var(--axis)" stroke-width="2" marker-end="url(#mx)"/>
<line x1="380" y1="280" x2="600" y2="280" style="stroke:var(--b)" stroke-width="3.5" stroke-linecap="round"/>
<path d="M380 280L402 280L512 230.5L600 230.5" fill="none" style="stroke:var(--a)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sm" x="560" y="222" style="fill:var(--a)">A</text>
<text class="sm" x="560" y="300" style="fill:var(--b)">B</text>
<text class="ax" x="390" y="168"><tspan font-style="italic">v</tspan> in m/s</text>
<text class="ax" x="614" y="357" text-anchor="end"><tspan font-style="italic">t</tspan> in s</text>
<text class="sm" x="419" y="194" style="fill:var(--start)">Beginn</text>
<text class="sm" x="591" y="194" text-anchor="end" style="fill:var(--end)">Ende</text>
</svg>
