<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Ein Pkw überholt einen Lkw, beide mit konstanter Geschwindigkeit; darunter das Zeit-Ort-Diagramm mit zwei Geraden, die sich schneiden">
<style>
  svg{--bg:#f6f7f9;--ink:#16191d;--muted:#5d6670;--axis:#8f98a3;--grid:#e3e6ea;
      --a:#2563eb;--b:#d9590b;--start:#15803d;--end:#c81e1e;
      --road:#575b61;--lane:#f8f8f8;--grass:#a6c793;--glass:#ffffff}
  @media (prefers-color-scheme: dark){
    svg{--bg:#22262c;--ink:#e7eaee;--muted:#9aa3ad;--axis:#66707b;--grid:#2e333a;
        --a:#5b8cff;--b:#ff8a3d;--start:#34c46b;--end:#f05a5a;
        --road:#3b3f45;--lane:#d9d9d9;--grass:#3d5634;--glass:#1b1e23}
  }
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--ink)}
  .lbl{font-size:23px;font-style:italic;font-weight:600}
  .car{font-size:17px;font-weight:700;fill:#ffffff}
  .ax{font-size:19px;fill:var(--muted)}
  .sm{font-size:18px;font-weight:600}
</style>
<defs>
  <marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--a)"/></marker>
  <marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--b)"/></marker>
  <marker id="mx" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--axis)"/></marker>
</defs>
<rect width="640" height="360" style="fill:var(--bg)"/>

<!-- Straße -->
<rect x="0" y="14" width="640" height="10" style="fill:var(--grass)"/>
<rect x="0" y="24" width="640" height="112" style="fill:var(--road)"/>
<rect x="0" y="136" width="640" height="10" style="fill:var(--grass)"/>
<line x1="0" y1="29" x2="640" y2="29" style="stroke:var(--lane)" stroke-width="2"/>
<line x1="0" y1="131" x2="640" y2="131" style="stroke:var(--lane)" stroke-width="2"/>
<line x1="0" y1="80" x2="640" y2="80" style="stroke:var(--lane)" stroke-width="3" stroke-dasharray="26 22"/>

<!-- Lkw B -->
<rect x="310" y="89" width="122" height="34" rx="3" style="fill:var(--b)" opacity=".75"/>
<rect x="435" y="91" width="26" height="30" rx="4" style="fill:var(--b)"/>
<rect x="452" y="94" width="6" height="24" rx="2" style="fill:var(--glass)" opacity=".5"/>
<text class="car" x="371" y="111" text-anchor="middle">B</text>
<line x1="470" y1="106" x2="518" y2="106" style="stroke:var(--b)" stroke-width="4" stroke-linecap="round" marker-end="url(#mb)"/>
<text class="lbl" x="528" y="114" style="fill:var(--b)">v<tspan font-size="15" dy="4">B</tspan></text>

<!-- Pkw A -->
<rect x="196" y="41" width="58" height="28" rx="7" style="fill:var(--a)"/>
<rect x="232" y="45" width="10" height="20" rx="3" style="fill:var(--glass)" opacity=".5"/>
<text class="car" x="217" y="61" text-anchor="middle">A</text>
<line x1="264" y1="55" x2="360" y2="55" style="stroke:var(--a)" stroke-width="4" stroke-linecap="round" marker-end="url(#ma)"/>
<text class="lbl" x="370" y="63" style="fill:var(--a)">v<tspan font-size="15" dy="4">A</tspan></text>

<!-- Zeit-Ort-Diagramm -->
<g style="stroke:var(--grid)" stroke-width="1.5">
  <line x1="70" y1="295" x2="590" y2="295"/><line x1="70" y1="255" x2="590" y2="255"/>
  <line x1="70" y1="215" x2="590" y2="215"/>
</g>
<line x1="209" y1="178" x2="209" y2="335" style="stroke:var(--start)" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="440" y1="178" x2="440" y2="335" style="stroke:var(--end)" stroke-width="2" stroke-dasharray="5 4"/>
<text class="sm" x="215" y="196" style="fill:var(--start)">Beginn</text>
<text class="sm" x="446" y="196" style="fill:var(--end)">Ende</text>
<line x1="70" y1="335" x2="604" y2="335" style="stroke:var(--axis)" stroke-width="2" marker-end="url(#mx)"/>
<line x1="70" y1="335" x2="70" y2="168" style="stroke:var(--axis)" stroke-width="2" marker-end="url(#mx)"/>
<line x1="70" y1="335" x2="580" y2="180" style="stroke:var(--a)" stroke-width="3.5" stroke-linecap="round"/>
<line x1="70" y1="280" x2="580" y2="235" style="stroke:var(--b)" stroke-width="3.5" stroke-linecap="round"/>
<circle cx="324.6" cy="257.6" r="5" style="fill:var(--bg);stroke:var(--ink)" stroke-width="2"/>
<text class="sm" x="586" y="184" style="fill:var(--a)">A</text>
<text class="sm" x="586" y="240" style="fill:var(--b)">B</text>
<text class="ax" x="80" y="178"><tspan font-style="italic">x</tspan> in m</text>
<text class="ax" x="604" y="357" text-anchor="end"><tspan font-style="italic">t</tspan> in s</text>
</svg>
